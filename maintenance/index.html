<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Website Sedang Dalam Perbaikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-spin-slow {
            animation: spin-slow 12s linear infinite;
        }
        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
        .tech-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 sm:p-6 selection:bg-amber-500 selection:text-slate-950 font-sans overflow-hidden relative tech-grid">

    <!-- Background Ambient Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-[120px] pointer-events-none animate-pulse-glow"></div>

    <!-- Main Maintenance Container -->
    <div class="relative max-w-xl w-full bg-slate-900/90 backdrop-blur-2xl border border-slate-800 rounded-3xl p-8 sm:p-12 shadow-2xl text-center">
        
        <!-- Top Status & System Badge -->
        <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs sm:text-sm font-semibold tracking-wider uppercase mb-8 shadow-inner">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
            STATUS: MAINTENANCE
        </div>

        <!-- Animated Technical Icon (Gear & Wrench concept) -->
        <div class="relative w-24 h-24 sm:w-28 sm:h-28 mx-auto mb-8 flex items-center justify-center">
            <!-- Outer Ring Gear Simulation -->
            <div class="absolute inset-0 border-2 border-dashed border-amber-500/30 rounded-3xl animate-spin-slow"></div>
            <!-- Inner Glowing Box -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 sm:w-11 sm:h-11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
        </div>

        <!-- Main Heading (Bold, High Contrast) -->
        <h1 class="text-2xl sm:text-4xl font-black tracking-tight text-white mb-4 uppercase">
            WEBSITE SEDANG DALAM MAINTENANCE
        </h1>

        <!-- Supporting Text -->
        <p class="text-sm sm:text-base text-slate-400 mb-8 leading-relaxed max-w-md mx-auto">
            Kami sedang melakukan pengembangan dan perbaikan pada website. Silakan kembali lagi nanti.
        </p>

        <!-- System Diagnostic / Progress Indicator Bar -->
        <div class="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl mb-8 text-left space-y-2">
            <div class="flex justify-between items-center text-xs font-mono text-slate-400">
                <span class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    OPTIMASI SISTEM & INFRASTRUKTUR
                </span>
                <span class="text-amber-400 font-bold">PROSES BERLANGSUNG</span>
            </div>
            <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                <div class="bg-gradient-to-r from-amber-500 to-orange-500 h-full rounded-full w-4/5 animate-pulse"></div>
            </div>
        </div>

        <!-- Footer Info / Brand ID -->
        <div class="pt-6 border-t border-slate-800/80 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-3 font-medium">
            <span>&copy; <span id="currentYear"></span> Tim Infrastruktur Website</span>
            <span class="text-amber-500/80 font-mono text-[11px] bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20">Secure Maintenance Mode</span>
        </div>
    </div>

    <script>
        // Set dynamic year
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
