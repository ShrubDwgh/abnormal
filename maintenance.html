<!DOCTYPE html>
<html lang="id" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maintenance - Website Sedang Dalam Perbaikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.08); }
        }
        .animate-spin-slow {
            animation: spin-slow 15s linear infinite;
        }
        .animate-pulse-glow {
            animation: pulse-glow 5s ease-in-out infinite;
        }
        .tech-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Lock down scrolling and bouncing globally */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: pan-x pan-y;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center p-4 selection:bg-amber-500 selection:text-slate-950 font-sans tech-grid m-0">

    <!-- Background Ambient Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-glow"></div>

    <!-- Main Maintenance Container (Centered, Fixed Dimension constraints, No scroll) -->
    <div class="relative w-full max-w-lg bg-slate-900/95 backdrop-blur-2xl border border-slate-800/80 rounded-3xl p-6 sm:p-10 shadow-2xl text-center select-none">
        
        <!-- Status Badge -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs sm:text-sm font-extrabold tracking-widest uppercase mb-6 shadow-inner">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
            STATUS: MAINTENANCE
        </div>

        <!-- Technical Animated Icon -->
        <div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto mb-6 flex items-center justify-center">
            <div class="absolute inset-0 border-2 border-dashed border-amber-500/30 rounded-2xl animate-spin-slow"></div>
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-br from-amber-500 to-orange-600 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/25 text-slate-950">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-9 sm:h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
        </div>

        <!-- Main Heading (Extra Bold / Black, Dominant) -->
        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white mb-3 uppercase leading-tight">
            WEBSITE SEDANG DALAM MAINTENANCE
        </h1>

        <!-- Supporting Text -->
        <p class="text-xs sm:text-sm text-slate-400 mb-6 leading-relaxed max-w-sm mx-auto font-medium">
            Kami sedang melakukan pengembangan dan perbaikan pada website. Silakan kembali lagi nanti.
        </p>

        <!-- System Indicator Bar -->
        <div class="bg-slate-950/80 border border-slate-800/90 p-3.5 rounded-xl mb-6 text-left space-y-2">
            <div class="flex justify-between items-center text-[11px] font-mono text-slate-400">
                <span class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    SISTEM OFFLINE UNTUK PEMBARUAN
                </span>
                <span class="text-amber-400 font-bold">100% SECURE</span>
            </div>
            <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-800">
                <div class="bg-gradient-to-r from-amber-500 to-orange-500 h-full rounded-full w-full animate-pulse"></div>
            </div>
        </div>

        <!-- Footer ID -->
        <div class="pt-4 border-t border-slate-800/80 text-[11px] text-slate-500 flex items-center justify-between font-mono">
            <span>&copy; <span id="currentYear"></span> SYSTEM CORE</span>
            <span class="text-amber-400/90 font-bold bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">LOCKED</span>
        </div>
    </div>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
